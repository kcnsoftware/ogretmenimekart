<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Öğretmenler Günü Kartı</title>
    <!-- El Yazısı Fontu (Pacifico) Google Fonts üzerinden eklendi -->
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <style>
        body {
            /* Arka planı tamamen mavi yaptık */
            font-family: 'Inter', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #2c3e50; 
            margin: 0;
            padding: 20px;
        }
        .kart-container {
            width: 100%;
            max-width: 400px;
            /* Kart rengini çok açık mavi yaptık */
            background: #f0f0f5; 
            border-radius: 16px; /* Daha yuvarlak */
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15); /* Daha belirgin gölge */
            overflow: hidden;
            padding-bottom: 20px;
        }
        .resim-alani {
            width: 100%;
            height: auto;
            /* Resim altındaki çizgiyi daha belirgin bir mavi yaptık */
            border-bottom: 4px solid #0056b3; 
            overflow: hidden;
            position: relative;
        }
        .resim-alani img {
            width: 100%;
            display: block;
        }
        .form-container, .tebrik-alani {
            padding: 20px;
            text-align: center;
        }
        .form-container h2 {
            font-size: 1.5em;
            color: #333;
            margin-bottom: 15px;
        }
        #isimForm input[type="text"] {
            width: 90%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
        }
        #isimForm button {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            transition: background-color 0.3s;
        }
        #isimForm button:hover {
            background-color: #0056b3;
        }

        /* --- TEBRİK ALANI STİLLERİ --- */
        .tebrik-alani {
            display: none; 
            text-align: center;
            margin-top: 10px;
        }
        .tebrik-isim {
            /* El yazısı fontu ve rengi daha canlı kırmızı */
            font-family: 'Pacifico', cursive;
            font-size: 2.2em; 
            color: #cc3333; 
            font-weight: normal; 
            margin-bottom: 15px;
            margin-top: 15px;
        }
        .tebrik-mesaj {
            font-size: 1.1em;
            color: #333;
            line-height: 1.0; 
            margin-bottom: 10px;
        }
        .tebrik-mesaj p {
            margin-top: 0.3em; 
            margin-bottom: 0.3em;
        }
        .kutlu-olsun {
            font-size: 1.5em;
            /* Kutlama metnine canlı turkuaz mavi */
            color: #00bcd4; 
            font-weight: bold;
            margin-top: 10px;
        }

        /* --- ALT BİLGİ STİLLERİ --- */
        .alt-sol-container {
            /* Ortalamayı koruduk */
            display: flex;
            /* Flex yönünü dikey yaptık (Arma üste, yazı alta) */
            flex-direction: column; 
            align-items: center;
            justify-content: center; 
            padding: 15px 20px;
            border-top: 1px solid #ddd;
            background-color: #e8f3ff; 
        }
        .okul-armasi {
            /* Arma boyutu büyütüldü (40px -> 60px) */
            width: 60px;
            height: 60px;
            /* Metin yukarı alındığı için sağ margin kaldırıldı, alttan boşluk eklendi */
            margin-right: 0;
            margin-bottom: 8px; 
            border-radius: 50%; 
        }
        .alt-sol-yazi {
            font-size: 0.9em; /* Yazı boyutu hafifçe büyütüldü */
            color: #0056b3; 
            font-weight: 600; /* Daha kalın yaptık */
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="kart-container">
        <div class="resim-alani">
            <!-- ÜST KART RESMİ YEREL OLARAK EKLENDİ -->
            <img src="kart_resmi.png" alt="Öğretmenler Günü Kartı Resmi" onerror="this.onerror=null;this.src='https://placehold.co/400x200/0056b3/ffffff?text=KART+RESMİ+YOK'">
        </div>

        <div class="form-container">
            <h2>İsim Yazınız</h2>
            <form id="isimForm">
                <input type="text" id="adSoyad" placeholder="Adınız ve Soyadınız">
                <button type="submit">Gönder</button>
            </form>
        </div>

        <div class="tebrik-alani">
            <!-- İsim alanı: El yazısı fontu uygulanmış yer -->
            <p class="tebrik-isim"></p> 
            <div class="tebrik-mesaj">
                <!-- Öğretmenler Günü mesajı -->
                <p>Değerli Öğretmenlerimiz,</p>
                <p>Geleceği inşa eden, bilgiyle ışık tutan siz kıymetli</p>
                <p>eğitim neferlerinin 24 Kasım Öğretmenler Günü’nü</p>
                <p>en içten dileklerimizle kutluyoruz.</p>
                <p class="kutlu-olsun">KUTLU OLSUN! 🎉</p>
            </div>
        </div>

        <div class="alt-sol-container">
            <!-- OKUL ARMASI RESMİ YEREL OLARAK EKLENDİ (Metin üstüne taşındı) -->
            <img src="okul_armasi.jpg" alt="Okul Arması" class="okul-armasi" onerror="this.onerror=null;this.src='https://placehold.co/60x60/d9534f/ffffff?text=A'">
            <div class="alt-sol-yazi">
                Hezarfen MTAL Elektrik Elektronik Teknolojisi Alanı
            </div>
        </div>
    </div>
    <script>
        // TEK SAYFADA DİNAMİK İÇERİK DEĞİŞİMİ İÇİN JAVASCRIPT
        document.addEventListener('DOMContentLoaded', function() {
            const isimForm = document.getElementById('isimForm');
            const adSoyadInput = document.getElementById('adSoyad');
            const formContainer = document.querySelector('.form-container');
            const tebrikAlani = document.querySelector('.tebrik-alani');
            const tebrikIsim = tebrikAlani.querySelector('.tebrik-isim');

            // Başlangıçta sadece formu göster
            formContainer.style.display = 'block';
            tebrikAlani.style.display = 'none';

            isimForm.addEventListener('submit', function(event) {
                event.preventDefault(); // Sayfanın yeniden yüklenmesini engelle

                const girilenIsim = adSoyadInput.value.trim(); // Girilen ismi al

                if (girilenIsim) {
                    // İsim alanına girilen ismi yazar
                    tebrikIsim.textContent = girilenIsim; 

                    // Formu gizle, tebrik mesajını göster
                    formContainer.style.display = 'none'; 
                    tebrikAlani.style.display = 'block'; 

                } else {
                    // İsim girilmezse uyarı ver
                    alert('Lütfen isminizi girin.'); 
                }
            });
        });
    </script>
</body>
</html>
